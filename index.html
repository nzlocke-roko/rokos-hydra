<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roko's Hydra</title>
    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
        margin: 0;
      }
      h1 {
        color: #ff5252;
      }
      .shogi-btn {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 20px;
        background-color: #333;
        color: #888;
        text-decoration: none;
        border-radius: 5px;
        border: 1px dashed #555;
        font-size: 14px;
      }
      .shogi-btn:hover {
        background-color: #444;
        color: #fff;
        border-color: #ff5252;
      }

      /* Roka Mascot Styling */
      .roka-container {
        position: fixed;
        bottom: 0;
        left: 20px;
        display: flex;
        align-items: flex-end;
        z-index: 100;
        pointer-events: none; /* Lets clicks pass through empty space */
      }
      .roka-container img {
        height: 250px;
        pointer-events: auto; /* Lets you hover/click Roka if needed */
        filter: drop-shadow(0 5px 15px rgba(0,0,0,0.7));
      }
      .speech-bubble {
        background: #1e1e1e;
        border: 2px solid #ff5252;
        color: #e0e0e0;
        padding: 12px 16px;
        border-radius: 12px;
        max-width: 220px;
        font-size: 13px;
        text-align: left;
        margin-bottom: 40px;
        margin-left: -10px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        position: relative;
        pointer-events: auto;
      }
      .speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        bottom: 15px;
        border-width: 8px 10px 8px 0;
        border-style: solid;
        border-color: transparent #ff5252 transparent;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Roko's Hydra</h1>
    <p>Status: Online and unblocked.</p>
    
    <br>
    <a href="shogi.html" class="shogi-btn">⚠️ Experimental Shogi Lab (Proceed with Caution)</a>

    <!-- Roka Mascot Element -->
    <div class="roka-container">
      <img src="assets/roka.png" alt="Roka Mascot">
      <div class="speech-bubble" id="rokaText">
        Scanning system...
      </div>
    </div>

    <script>
      // Roka's startup dialogue tracking version 0.1.3 update log
      const dialogueLog = [
        "v0.1.3 loaded. Don't touch things you don't understand.",
        "Added the Shogi Lab. Good luck figuring out the pieces.",
        "Reporting for duty. Check the lab if you're brave enough."
      ];
      
      // Pick a random line on load
      const randomLine = dialogueLog[Math.floor(Math.random() * dialogueLog.length)];
      document.getElementById('rokaText').innerText = randomLine;
    </script>
  </body>
</html>
