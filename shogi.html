<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roko's Shogi Lab</title>
    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 20px;
        margin: 0;
      }
      h1 {
        color: #ff5252;
        margin-bottom: 5px;
      }
      .lab-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .board-container {
        display: inline-block;
        background-color: #dcb35c;
        border: 4px solid #5c3a21;
        padding: 10px;
        margin-top: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        position: relative;
      }
      .shogi-grid {
        display: grid;
        grid-template-columns: repeat(9, 50px);
        grid-template-rows: repeat(9, 50px);
        gap: 1px;
        background-color: #5c3a21;
      }
      .tile {
        background-color: #e6c280;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: #111;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.1s;
      }
      .tile:hover {
        background-color: #f0d19a;
      }
      .tile.selected {
        background-color: #ff8a80 !important;
      }
      .tile.highlight {
        background-color: #a5d6a7 !important;
      }
      .tile.check-glow {
        background-color: #e53935 !important;
      }
      .gote {
        transform: rotate(180deg);
        color: #5c1d1d;
      }
      .sente {
        color: #111;
      }
      .hand-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        background-color: #1e1e1e;
        border: 2px solid #333;
        padding: 10px;
        margin: 10px auto;
        width: 480px;
        min-height: 40px;
        border-radius: 6px;
      }
      .hand-piece {
        background-color: #e6c280;
        border: 2px solid #5c3a21;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
      }
      .hand-piece.selected {
        background-color: #ff8a80;
      }
      .turn-indicator {
        font-size: 18px;
        font-weight: bold;
        margin: 10px 0;
        color: #ffcc80;
      }
      .status-banner {
        font-size: 16px;
        font-weight: bold;
        color: #ff5252;
        min-height: 24px;
        margin-bottom: 5px;
      }
      .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 16px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        border: 1px solid #444;
      }
      .back-btn:hover {
        background-color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Shogi Lab</h1>
    <p>Phase 7: Check, Checkmate & Win Conditions</p>

    <div class="turn-indicator" id="turnIndicator">Current Turn: Sente (Player)</div>
    <div class="status-banner" id="statusBanner"></div>

    <div class="lab-container">
      <!-- Gote Hand (Top) -->
      <div class="hand-container" id="goteHandUI"></div>

      <div class="board-container">
        <div class="shogi-grid" id="shogiBoard"></div>
      </div>

      <!-- Sente Hand (Bottom) -->
      <div class="hand-container" id="senteHandUI"></div>
    </div>

    <br>
    <a href="index.html" class="back-btn">← Back to Roko's Hydra</a>

    <script>
      let initialBoard = [
        ['l', 'n', 's', 'g', 'k', 'g', 's', 'n', 'l'],
        ['.', 'r', '.', '.', '.', '.', '.', 'b', '.'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['.', 'B', '.', '.', '.', '.', '.', 'R', '.'],
        ['L', 'N', 'S', 'G', 'K', 'G', 'S', 'N', 'L']
      ];

      const promotedPieces = {
        'p': '+p', 'P': '+P',
        'l': '+l', 'L': '+L',
        'n': '+n', 'N': '+N',
        's': '+s', 'S': '+S',
        'r': '+r', 'R': '+R',
        'b': '+b', 'B': '+B'
      };

      const pieceKanji = {
        'p': '歩', 'P': '歩', '+p': 'と', '+P': 'と',
        'l': '香', 'L': '香', '+l': '成香', '+L': '成香',
        'n': '桂', 'N': '桂', '+n': '成桂', '+N': '成桂',
        's': '銀', 'S': '銀', '+s': '成銀', '+S': '成銀',
        'g': '金', 'G': '金',
        'k': '王', 'K': '王',
        'r': '飛', 'R': '飛', '+r': '竜', '+R': '竜',
        'b': '角', 'B': '角', '+b': '馬', '+B': '馬'
      };

      let selectedTile = null;
      let selectedHandPiece = null; 
      let validMoves = []; 
      let currentTurn = 'sente'; // 'sente' or 'gote'
      let gameOver = false;

      let senteHand = [];
      let goteHand = [];

      function isValidCoord(row, col) {
        return row >= 0 && row < 9 && col >= 0 && col < 9;
      }

      function addSlidingMoves(row, col, isSente, directions, moves, boardState = initialBoard) {
        for (let d of directions) {
          let r = row + d.row;
          let c = col + d.col;
          while (isValidCoord(r, c)) {
            const target = boardState[r][c];
            if (target === '.') {
              moves.push({ row: r, col: c });
            } else {
              const targetIsSente = target === target.toUpperCase();
              if (isSente !== targetIsSente) {
                moves.push({ row: r, col: c });
              }
              break; 
            }
            r += d.row;
            c += d.col;
          }
        }
      }

      function getLegalMoves(row, col, piece, boardState = initialBoard) {
        const moves = [];
        const isSente = piece === piece.toUpperCase(); 
        const dir = isSente ? -1 : 1; 
        const isPromoted = piece.startsWith('+');
        const pType = piece.toLowerCase().replace('+', '');

        if (pType === 'g' || (isPromoted && ['p', 'l', 'n', 's'].includes(pType))) {
          const goldDirs = [
            {row: dir, col: 0}, {row: -dir, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}, {row: dir, col: -1}, {row: dir, col: 1}
          ];
          for (let d of goldDirs) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (!isPromoted && pType === 'p') {
          const nextRow = row + dir;
          if (isValidCoord(nextRow, col)) {
            const target = boardState[nextRow][col];
            if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
              moves.push({ row: nextRow, col: col });
            }
          }
        }
        else if (pType === 'k') {
          const directions = [
            {row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}, 
            {row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}
          ];
          for (let d of directions) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (pType === 's') {
          const silverDirs = [
            {row: dir, col: 0}, {row: dir, col: -1}, {row: dir, col: 1}, {row: -dir, col: -1}, {row: -dir, col: 1}
          ];
          for (let d of silverDirs) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (pType === 'n') {
          const knightRow = row + (dir * 2);
          const knightCols = [col - 1, col + 1];
          for (let c of knightCols) {
            if (isValidCoord(knightRow, c)) {
              const target = boardState[knightRow][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: knightRow, col: c });
              }
            }
          }
        }
        else if (pType === 'l') {
          addSlidingMoves(row, col, isSente, [{row: dir, col: 0}], moves, boardState);
        }
        else if (pType === 'r') {
          addSlidingMoves(row, col, isSente, [
            {row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}
          ], moves, boardState);
          if (isPromoted) {
            const diagDirs = [{row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}];
            for (let d of diagDirs) {
              const r = row + d.row;
              const c = col + d.col;
              if (isValidCoord(r, c)) {
                const target = boardState[r][c];
                if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                  moves.push({ row: r, col: c });
                }
              }
            }
          }
        }
        else if (pType === 'b') {
          addSlidingMoves(row, col, isSente, [
            {row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}
          ], moves, boardState);
          if (isPromoted) {
            const orthoDirs = [{row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}];
            for (let d of orthoDirs) {
              const r = row + d.row;
              const c = col + d.col;
              if (isValidCoord(r, c)) {
                const target = boardState[r][c];
                if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                  moves.push({ row: r, col: c });
                }
              }
            }
          }
        }

        return moves;
      }

      function findKing(player, boardState = initialBoard) {
        const kingChar = player === 'sente' ? 'K' : 'k';
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (boardState[r][c] === kingChar) {
              return { row: r, col: c };
            }
          }
        }
        return null;
      }

      function isSquareUnderAttack(row, col, attackingPlayer, boardState = initialBoard) {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const piece = boardState[r][c];
            if (piece !== '.') {
              const isPieceSente = piece === piece.toUpperCase();
              const pieceOwner = isPieceSente ? 'sente' : 'gote';
              if (pieceOwner === attackingPlayer) {
                const moves = getLegalMoves(r, c, piece, boardState);
                if (moves.some(m => m.row === row && m.col === col)) {
                  return true;
                }
              }
            }
          }
        }
        return false;
      }

      function isInCheck(player, boardState = initialBoard) {
        const kingPos = findKing(player, boardState);
        if (!kingPos) return false;
        const opponent = player === 'sente' ? 'gote' : 'sente';
        return isSquareUnderAttack(kingPos.row, kingPos.col, opponent, boardState);
      }

      function hasAnyLegalMoves(player) {
        // Check board pieces
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const piece = initialBoard[r][c];
            if (piece !== '.' && ((player === 'sente' && piece === piece.toUpperCase()) || (player === 'gote' && piece === piece.toLowerCase()))) {
              const moves = getLegalMoves(r, c, piece);
              for (let m of moves) {
                // Simulate move
                const targetBackup = initialBoard[m.row][m.col];
                initialBoard[m.row][m.col] = piece;
                initialBoard[r][c] = '.';

                const stillInCheck = isInCheck(player);

                // Revert simulation
                initialBoard[r][c] = piece;
                initialBoard[m.row][m.col] = targetBackup;

                if (!stillInCheck) return true;
              }
            }
          }
        }

        // Check hand pieces drops
        const hand = player === 'sente' ? senteHand : goteHand;
        if (hand.length > 0) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (initialBoard[r][c] === '.') {
                // Any valid empty drop counts as a legal move option roughly
                return true;
              }
            }
          }
        }

        return false;
      }

      function renderHands() {
        const senteUI = document.getElementById('senteHandUI');
        const goteUI = document.getElementById('goteHandUI');
        senteUI.innerHTML = '';
        goteUI.innerHTML = '';

        senteHand.forEach((p, index) => {
          const div = document.createElement('div');
          div.classList.add('hand-piece');
          if (!gameOver && currentTurn === 'sente' && selectedHandPiece === index) {
            div.classList.add('selected');
          }
          div.innerText = pieceKanji[p] || p;
          div.addEventListener('click', () => selectHandPiece('sente', index));
          senteUI.appendChild(div);
        });

        goteHand.forEach((p, index) => {
          const div = document.createElement('div');
          div.classList.add('hand-piece', 'gote');
          if (!gameOver && currentTurn === 'gote' && selectedHandPiece === index) {
            div.classList.add('selected');
          }
          div.innerText = pieceKanji[p] || p;
          div.addEventListener('click', () => selectHandPiece('gote', index));
          goteUI.appendChild(div);
        });
      }

      function selectHandPiece(player, index) {
        if (gameOver || currentTurn !== player) return;
        
        if (selectedHandPiece === index) {
          selectedHandPiece = null;
          validMoves = [];
        } else {
          selectedHandPiece = index;
          selectedTile = null;
          validMoves = [];
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (initialBoard[r][c] === '.') {
                validMoves.push({ row: r, col: c });
              }
            }
          }
        }
        renderBoard();
        renderHands();
      }

      function renderBoard() {
        const boardElement = document.getElementById('shogiBoard');
        boardElement.innerHTML = '';
        
        const turnText = currentTurn === 'sente' ? 'Sente (Player)' : 'Gote (Opponent)';
        document.getElementById('turnIndicator').innerText = `Current Turn: ${turnText}`;

        const statusBanner = document.getElementById('statusBanner');
        if (gameOver) {
          statusBanner.innerText = `GAME OVER! ${currentTurn === 'sente' ? 'Gote' : 'Sente'} wins by Checkmate!`;
        } else if (isInCheck(currentTurn)) {
          statusBanner.innerText = `⚠️ CHECK! Your King is under attack!`;
        } else {
          statusBanner.innerText = '';
        }

        const checkedKingPos = isInCheck(currentTurn) ? findKing(currentTurn) : null;

        for (let row = 0; row < 9; row++) {
          for (let col = 0; col < 9; col++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.dataset.row = row;
            tile.dataset.col = col;

            if (validMoves.some(m => m.row === row && m.col === col)) {
              tile.classList.add('highlight');
            }

            if (checkedKingPos && checkedKingPos.row === row && checkedKingPos.col === col) {
              tile.classList.add('check-glow');
            }

            const piece = initialBoard[row][col];
            if (piece !== '.') {
              const span = document.createElement('span');
              span.innerText = pieceKanji[piece] || piece;
              if (piece === piece.toLowerCase()) {
                span.classList.add('gote');
              } else {
                span.classList.add('sente');
              }
              tile.appendChild(span);
            }

            tile.addEventListener('click', () => handleTileClick(row, col));
            boardElement.appendChild(tile);
          }
        }
        renderHands();
      }

      function handleTileClick(row, col) {
        if (gameOver) return;
        const clickedPiece = initialBoard[row][col];
        
        // 1. Drop handler
        if (selectedHandPiece !== null) {
          const isValidDrop = validMoves.some(m => m.row === row && m.col === col);
          if (isValidDrop && clickedPiece === '.') {
            const hand = currentTurn === 'sente' ? senteHand : goteHand;
            const droppedPiece = hand.splice(selectedHandPiece, 1)[0];
            
            // Simulate drop
            initialBoard[row][col] = droppedPiece;
            if (isInCheck(currentTurn)) {
              // Illegal drop leaving king in check (revert)
              hand.push(droppedPiece);
              initialBoard[row][col] = '.';
              alert("Illegal drop! That leaves your King in check.");
              return;
            }

            currentTurn = currentTurn === 'sente' ? 'gote' : 'sente';
            selectedHandPiece = null;
            validMoves = [];

            // Check if opponent is checkmated
            if (!hasAnyLegalMoves(currentTurn)) {
              gameOver = true;
            }

            renderBoard();
          }
          return;
        }

        // 2. Normal movement
        if (selectedTile === null) {
          const isCurrentSentePiece = clickedPiece !== '.' && clickedPiece === clickedPiece.toUpperCase();
          const isCurrentGotePiece = clickedPiece !== '.' && clickedPiece === clickedPiece.toLowerCase();

          if ((currentTurn === 'sente' && isCurrentSentePiece) || (currentTurn === 'gote' && isCurrentGotePiece)) {
            selectedTile = { row, col };
            validMoves = getLegalMoves(row, col, clickedPiece);
            renderBoard();
            
            const idx = row * 9 + col;
            document.getElementById('shogiBoard').children[idx].classList.add('selected');
          }
        } else {
          const isValidMove = validMoves.some(m => m.row === row && m.col === col);
          
          if (isValidMove) {
            // Simulate the move to ensure it doesn't leave own King in check
            const movingPiece = initialBoard[selectedTile.row][selectedTile.col];
            const targetBackup = initialBoard[row][col];

            initialBoard[row][col] = movingPiece;
            initialBoard[selectedTile.row][selectedTile.col] = '.';

            if (isInCheck(currentTurn)) {
              // Revert because it's illegal (leaves king in check)
              initialBoard[selectedTile.row][selectedTile.col] = movingPiece;
              initialBoard[row][col] = targetBackup;
              alert("Illegal move! Your King would be in check.");
              selectedTile = null;
              validMoves = [];
              renderBoard();
              return;
            }

            // Real execution of capture if any
            if (targetBackup !== '.') {
              const capturedBase = targetBackup.toLowerCase().replace('+', '');
              if (currentTurn === 'sente') {
                senteHand.push(capturedBase.toUpperCase());
              } else {
                goteHand.push(capturedBase.toLowerCase());
              }
            }

            let finalPiece = initialBoard[row][col];
            let isPromoted = finalPiece.startsWith('+');
            const baseType = finalPiece.toLowerCase().replace('+', '');
            const inPromotionZone = (currentTurn === 'sente' && (row <= 2 || selectedTile.row <= 2)) ||
                                    (currentTurn === 'gote' && (row >= 6 || selectedTile.row >= 6));

            if (!isPromoted && inPromotionZone && baseType !== 'g' && baseType !== 'k') {
              if (confirm(`Do you want to promote this ${pieceKanji[finalPiece] || finalPiece}?`)) {
                finalPiece = currentTurn === 'sente' ? promotedPieces[finalPiece].toUpperCase() : promotedPieces[finalPiece].toLowerCase();
                initialBoard[row][col] = finalPiece;
              }
            }

            // Switch turn
            currentTurn = currentTurn === 'sente' ? 'gote' : 'sente';

            // Check win condition
            if (!hasAnyLegalMoves(currentTurn)) {
              gameOver = true;
            }
          }
          
          selectedTile = null;
          validMoves = [];
          renderBoard();
        }
      }

      renderBoard();
    </script>
  </body>
</html>
