<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roko's Shogi Lab</title>
    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 20px;
        margin: 0;
      }
      h1 {
        color: #ff5252;
        margin-bottom: 5px;
      }
      .lab-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .board-container {
        display: inline-block;
        background-color: #dcb35c;
        border: 4px solid #5c3a21;
        padding: 10px;
        margin-top: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      }
      .shogi-grid {
        display: grid;
        grid-template-columns: repeat(9, 50px);
        grid-template-rows: repeat(9, 50px);
        gap: 1px;
        background-color: #5c3a21;
      }
      .tile {
        background-color: #e6c280;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: #111;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.1s;
      }
      .tile:hover {
        background-color: #f0d19a;
      }
      .tile.selected {
        background-color: #ff8a80 !important;
      }
      .tile.highlight {
        background-color: #a5d6a7 !important;
      }
      /* Gote (opponent) pieces face downward */
      .gote {
        transform: rotate(180deg);
        color: #5c1d1d;
      }
      .sente {
        color: #111;
      }
      .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 16px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        border: 1px solid #444;
      }
      .back-btn:hover {
        background-color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Shogi Lab</h1>
    <p>Phase 2: Interactive Board & Piece Rendering</p>

    <div class="lab-container">
      <div class="board-container">
        <div class="shogi-grid" id="shogiBoard"></div>
      </div>
    </div>

    <br>
    <a href="index.html" class="back-btn">← Back to Roko's Hydra</a>

    <script>
      // Initial Shogi Setup: 9x9 board layout representation 
      const initialBoard = [
        ['l', 'n', 's', 'g', 'k', 'g', 's', 'n', 'l'],
        ['.', 'r', '.', '.', '.', '.', '.', 'b', '.'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['.', 'B', '.', '.', '.', '.', '.', 'R', '.'],
        ['L', 'N', 'S', 'G', 'K', 'G', 'S', 'N', 'L']
      ];

      // Mapping letters to Japanese Shogi kanji characters
      const pieceKanji = {
        'p': '歩', 'P': '歩',
        'l': '香', 'L': '香',
        'n': '桂', 'N': '桂',
        's': '銀', 'S': '銀',
        'g': '金', 'G': '金',
        'k': '王', 'K': '王',
        'r': '飛', 'R': '飛',
        'b': '角', 'B': '角'
      };

      let selectedTile = null;
      let validMoves = []; // Tracks valid destination tiles for the selected piece

      // Helper function to check if coordinates are on the 9x9 board
      function isValidCoord(row, col) {
        return row >= 0 && row < 9 && col >= 0 && col < 9;
      }

      // Calculate legal moves based on piece type
      function getLegalMoves(row, col, piece) {
        const moves = [];
        const isSente = piece === piece.toUpperCase(); 
        const dir = isSente ? -1 : 1;

        // 1. PAWN (歩): Moves strictly 1 square straight forward
        if (piece.toLowerCase() === 'p') {
          const nextRow = row + dir;
          if (isValidCoord(nextRow, col)) {
            const target = initialBoard[nextRow][col];
            if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
              moves.push({ row: nextRow, col: col });
            }
          }
        }

        // 2. KING (王): Moves 1 square in any direction
        else if (piece.toLowerCase() === 'k') {
          const directions = [
            {row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}, 
            {row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}
          ];
          for (let d of directions) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = initialBoard[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }

        return moves;
      }

      function renderBoard() {
        const boardElement = document.getElementById('shogiBoard');
        boardElement.innerHTML = '';

        for (let row = 0; row < 9; row++) {
          for (let col = 0; col < 9; col++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.dataset.row = row;
            tile.dataset.col = col;

            // Highlight valid movement targets
            if (validMoves.some(m => m.row === row && m.col === col)) {
              tile.classList.add('highlight');
            }

            const piece = initialBoard[row][col];
            if (piece !== '.') {
              const span = document.createElement('span');
              span.innerText = pieceKanji[piece] || piece;
              if (piece === piece.toLowerCase()) {
                span.classList.add('gote');
              } else {
                span.classList.add('sente');
              }
              tile.appendChild(span);
            }

            tile.addEventListener('click', () => handleTileClick(row, col));
            boardElement.appendChild(tile);
          }
        }
      }

      function handleTileClick(row, col) {
        const clickedPiece = initialBoard[row][col];
        
        if (selectedTile === null) {
          // Only select if it's a player piece (Uppercase for Sente)
          if (clickedPiece !== '.' && clickedPiece === clickedPiece.toUpperCase()) {
            selectedTile = { row, col };
            validMoves = getLegalMoves(row, col, clickedPiece);
            renderBoard();
            
            const idx = row * 9 + col;
            document.getElementById('shogiBoard').children[idx].classList.add('selected');
          }
        } else {
          // Strictly check if the clicked tile is in our valid moves list
          const isValidMove = validMoves.some(m => m.row === row && m.col === col);
          
          if (isValidMove) {
            initialBoard[row][col] = initialBoard[selectedTile.row][selectedTile.col];
            initialBoard[selectedTile.row][selectedTile.col] = '.';
          }
          
          // Always reset selection whether the move was valid or not
          selectedTile = null;
          validMoves = [];
          renderBoard();
        }
      }

      // Initial render on load
      renderBoard();
    </script>
  </body>
</html>
