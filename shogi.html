<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roko's Shogi Lab</title>
    <style>
      body {
        background-color: #0c0c0e;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding-top: 20px;
        margin: 0;
      }
      h1 {
        color: #ff5252;
        margin-bottom: 5px;
        letter-spacing: 1px;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
      .menu-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
      }
      .menu-btn {
        width: 250px;
        padding: 15px;
        background: linear-gradient(145deg, #1e1e24, #141418);
        color: #ffcc80;
        border: 2px solid #5c3a21;
        font-size: 18px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      }
      .menu-btn:hover {
        background: linear-gradient(145deg, #2a2a32, #1a1a20);
        border-color: #ffcc80;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(255, 204, 128, 0.15);
      }

      /* Clean Spotlight Carousel Stage */
      .carousel-stage {
        perspective: 1200px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 20px auto 10px auto;
        height: 140px;
        width: 500px;
      }
      
      .carousel-card {
        background: linear-gradient(145deg, #1a1a20, #121216);
        border: 2px solid #333;
        border-radius: 50%;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: absolute;
        box-sizing: border-box;
      }

      /* Side Icons (Dimmed & Scaled Down) */
      .carousel-card.side {
        transform: translateX(var(--offset-x)) scale(0.65) translateZ(-100px);
        opacity: 0.25;
        filter: brightness(0.2) grayscale(100%);
        pointer-events: none;
        border-color: #111;
        z-index: 1;
      }
      
      #leftCard { --offset-x: -120px; }
      #rightCard { --offset-x: 120px; }

      /* Center Active Icon Spotlight */
      .carousel-card.active-card {
        transform: translateX(0) scale(1) translateZ(0);
        opacity: 1;
        filter: brightness(1);
        z-index: 5;
        border-color: #ffcc80;
        background: linear-gradient(145deg, #252530, #18181f);
        box-shadow: 0 0 25px rgba(255, 204, 128, 0.3), 0 10px 25px rgba(0,0,0,0.8);
      }

      .character-avatar {
        font-size: 42px;
      }

      /* Separated Spotlight Info Panel */
      .info-panel {
        background: linear-gradient(145deg, #16161c, #0f0f13);
        border: 2px solid #5c3a21;
        border-radius: 12px;
        width: 380px;
        min-height: 120px;
        margin: 0 auto 20px auto;
        padding: 15px 20px;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.03), 0 8px 20px rgba(0,0,0,0.5);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .character-name {
        font-size: 20px;
        font-weight: bold;
        color: #ffcc80;
        margin-bottom: 4px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .character-title {
        font-size: 13px;
        color: #ff5252;
        margin-bottom: 8px;
        font-style: italic;
        letter-spacing: 0.5px;
      }
      .character-desc {
        font-size: 13px;
        color: #bbb;
        line-height: 1.4;
        text-align: center;
      }

      .arrow-btn {
        background-color: #1a1a20;
        color: #ffcc80;
        border: 2px solid #5c3a21;
        font-size: 20px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 10;
        position: absolute;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      }
      #prevBtn { left: calc(50% - 165px); }
      #nextBtn { right: calc(50% - 165px); }

      .arrow-btn:hover {
        background-color: #2a2a35;
        border-color: #ffcc80;
        transform: scale(1.08);
      }

      .lab-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .board-container {
        display: inline-block;
        background-color: #dcb35c;
        border: 4px solid #5c3a21;
        padding: 10px;
        margin-top: 10px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        position: relative;
        border-radius: 4px;
      }
      .shogi-grid {
        display: grid;
        grid-template-columns: repeat(9, 50px);
        grid-template-rows: repeat(9, 50px);
        gap: 1px;
        background-color: #5c3a21;
      }
      .tile {
        background-color: #e6c280;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: #111;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.1s;
      }
      .tile:hover {
        background-color: #f0d19a;
      }
      .tile.selected {
        background-color: #ff8a80 !important;
      }
      .tile.highlight {
        background-color: #a5d6a7 !important;
      }
      .tile.check-glow {
        background-color: #e53935 !important;
        animation: pulseCheck 1s infinite alternate;
      }
      @keyframes pulseCheck {
        0% { background-color: #e53935; }
        100% { background-color: #ff5252; box-shadow: inset 0 0 10px rgba(255,255,255,0.6); }
      }
      .gote {
        transform: rotate(180deg);
        color: #5c1d1d;
      }
      .sente {
        color: #111;
      }
      .hand-container {
        display: flex;
        justify-content: center;
        gap: 8px;
        background-color: #141418;
        border: 2px solid #333;
        padding: 8px 12px;
        margin: 8px auto;
        width: 460px;
        min-height: 38px;
        border-radius: 8px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      }
      .hand-piece {
        background: linear-gradient(145deg, #e6c280, #c89f54);
        border: 2px solid #5c3a21;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        transition: transform 0.1s;
      }
      .hand-piece:hover {
        transform: translateY(-2px);
      }
      .hand-piece.selected {
        background: #ff8a80;
      }
      .turn-indicator {
        font-size: 16px;
        font-weight: bold;
        margin: 6px 0;
        color: #ffcc80;
        letter-spacing: 0.5px;
      }
      .status-banner {
        font-size: 15px;
        font-weight: bold;
        color: #ff5252;
        min-height: 22px;
        margin-bottom: 2px;
      }
      .back-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 8px 16px;
        background-color: #1a1a20;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        border: 1px solid #333;
        cursor: pointer;
        transition: all 0.2s;
      }
      .back-btn:hover {
        background-color: #2a2a32;
        border-color: #555;
      }
    </style>
  </head>
  <body>
    
    <!-- MAIN MENU SCREEN -->
    <div id="mainMenuScreen" class="screen active">
      <h1>Shogi Lab</h1>
      <p>Select a Game Mode</p>
      <div class="menu-container">
        <button class="menu-btn" onclick="startPvP()">Player vs Player</button>
        <button class="menu-btn" onclick="openCpuSelection()">Player vs CPU</button>
      </div>
      <br>
      <a href="index.html" class="back-btn">← Back to Roko's Hydra</a>
    </div>

    <!-- CPU CAROUSEL SELECTION SCREEN -->
    <div id="cpuMenuScreen" class="screen">
      <h1>Shogi Lab</h1>
      <p>Choose Your Opponent</p>
      
      <div class="carousel-stage">
        <button class="arrow-btn" id="prevBtn" onclick="prevOpponent()">&#10094;</button>
        
        <!-- Left Shadow Icon Only -->
        <div class="carousel-card side" id="leftCard">
          <div class="character-avatar" id="leftAvatar">🏴‍☠️</div>
        </div>

        <!-- Center Active Icon Spotlight -->
        <div class="carousel-card active-card" id="centerCard">
          <div class="character-avatar" id="centerAvatar">🐱</div>
        </div>

        <!-- Right Shadow Icon Only -->
        <div class="carousel-card side" id="rightCard">
          <div class="character-avatar" id="rightAvatar">🎤</div>
        </div>

        <button class="arrow-btn" id="nextBtn" onclick="nextOpponent()">&#10095;</button>
      </div>

      <!-- Isolated Spotlight Info Panel -->
      <div class="info-panel" id="infoPanel">
        <div class="character-name" id="centerName">Bean</div>
        <div class="character-title" id="centerTitle">The Kimono Cat</div>
        <div class="character-desc" id="centerDesc">Just your cat wearing a kimono. Moderately smart. Don't underestimate the feline instinct.</div>
      </div>

      <button class="menu-btn" onclick="startPvC()">Battle Opponent!</button>
      <br>
      <button class="back-btn" onclick="showScreen('mainMenuScreen')">← Back to Menu</button>
    </div>

    <!-- GAME BOARD SCREEN -->
    <div id="gameScreen" class="screen">
      <h1>Shogi Lab</h1>
      <p id="modeDescription">Phase 11: Clean Spotlight Carousel</p>

      <div class="turn-indicator" id="turnIndicator">Current Turn: Sente (Player)</div>
      <div class="status-banner" id="statusBanner"></div>

      <div class="lab-container">
        <!-- Gote Hand (Top) -->
        <div class="hand-container" id="goteHandUI"></div>

        <div class="board-container">
          <div class="shogi-grid" id="shogiBoard"></div>
        </div>

        <!-- Sente Hand (Bottom) -->
        <div class="hand-container" id="senteHandUI"></div>
      </div>

      <br>
      <button class="back-btn" onclick="showScreen('mainMenuScreen')">← Main Menu</button>
    </div>

    <script>
      let initialBoard = [
        ['l', 'n', 's', 'g', 'k', 'g', 's', 'n', 'l'],
        ['.', 'r', '.', '.', '.', '.', '.', 'b', '.'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['.', 'B', '.', '.', '.', '.', '.', 'R', '.'],
        ['L', 'N', 'S', 'G', 'K', 'G', 'S', 'N', 'L']
      ];

      const promotedPieces = {
        'p': '+p', 'P': '+P',
        'l': '+l', 'L': '+L',
        'n': '+n', 'N': '+N',
        's': '+s', 'S': '+S',
        'r': '+r', 'R': '+R',
        'b': '+b', 'B': '+B'
      };

      const pieceKanji = {
        'p': '歩', 'P': '歩', '+p': 'と', '+P': 'と',
        'l': '香', 'L': '香', '+l': '成香', '+L': '成香',
        'n': '桂', 'N': '桂', '+n': '成桂', '+N': '成桂',
        's': '銀', 'S': '銀', '+s': '成銀', '+S': '成銀',
        'g': '金', 'G': '金',
        'k': '王', 'K': '王',
        'r': '飛', 'R': '飛', '+r': '竜', '+R': '竜',
        'b': '角', 'B': '角', '+b': '馬', '+B': '馬'
      };

      const opponents = [
        {
          name: "Lacky",
          title: "The Corporate-Climbing Pirate",
          avatar: "🏴‍☠️",
          desc: "Pretty dumb. He's only playing to get a promotion from his boss, and honestly, he's totally new to this."
        },
        {
          name: "Bean",
          title: "The Kimono Cat",
          avatar: "🐱",
          desc: "Just your cat wearing a kimono. Moderately smart. Don't underestimate the feline instinct."
        },
        {
          name: "Kaai Yuki",
          title: "The Vocaloid Prodigy",
          avatar: "🎤",
          desc: "Featured in 'Shogi Ichiban' (which started it all!). Pretty good at the game, though she definitely has her dumb moments."
        }
      ];

      let currentOpponentIndex = 0;
      let gameMode = 'pvp';
      let selectedTile = null;
      let selectedHandPiece = null; 
      let validMoves = []; 
      let currentTurn = 'sente'; 
      let gameOver = false;
      let warningMessage = '';

      let senteHand = [];
      let goteHand = [];

      function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
      }

      function updateCarouselUI() {
        const leftIdx = (currentOpponentIndex - 1 + opponents.length) % opponents.length;
        const centerIdx = currentOpponentIndex;
        const rightIdx = (currentOpponentIndex + 1) % opponents.length;

        const left = opponents[leftIdx];
        const center = opponents[centerIdx];
        const right = opponents[rightIdx];

        // Update isolated icons
        document.getElementById('leftAvatar').innerText = left.avatar;
        document.getElementById('centerAvatar').innerText = center.avatar;
        document.getElementById('rightAvatar').innerText = right.avatar;

        // Update spotlight text panel cleanly with a quick reflow trigger
        const panel = document.getElementById('infoPanel');
        panel.style.animation = 'none';
        panel.offsetHeight; // trigger reflow
        panel.style.animation = 'fadeIn 0.3s ease';

        document.getElementById('centerName').innerText = center.name;
        document.getElementById('centerTitle').innerText = center.title;
        document.getElementById('centerDesc').innerText = center.desc;
      }

      function nextOpponent() {
        currentOpponentIndex = (currentOpponentIndex + 1) % opponents.length;
        updateCarouselUI();
      }

      function prevOpponent() {
        currentOpponentIndex = (currentOpponentIndex - 1 + opponents.length) % opponents.length;
        updateCarouselUI();
      }

      function openCpuSelection() {
        currentOpponentIndex = 0;
        updateCarouselUI();
        showScreen('cpuMenuScreen');
      }

      function resetBoardState() {
        initialBoard = [
          ['l', 'n', 's', 'g', 'k', 'g', 's', 'n', 'l'],
          ['.', 'r', '.', '.', '.', '.', '.', 'b', '.'],
          ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
          ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
          ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
          ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
          ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
          ['.', 'B', '.', '.', '.', '.', '.', 'R', '.'],
          ['L', 'N', 'S', 'G', 'K', 'G', 'S', 'N', 'L']
        ];
        senteHand = [];
        goteHand = [];
        currentTurn = 'sente';
        gameOver = false;
        selectedTile = null;
        selectedHandPiece = null;
        validMoves = [];
        warningMessage = '';
      }

      function startPvP() {
        gameMode = 'pvp';
        resetBoardState();
        document.getElementById('modeDescription').innerText = 'Player vs Player Match';
        showScreen('gameScreen');
        renderBoard();
      }

      function startPvC() {
        gameMode = 'pvc';
        resetBoardState();
        const activeOpp = opponents[currentOpponentIndex];
        document.getElementById('modeDescription').innerText = `Player vs CPU: Battle against ${activeOpp.name} (${activeOpp.title})`;
        showScreen('gameScreen');
        renderBoard();
      }

      function isValidCoord(row, col) {
        return row >= 0 && row < 9 && col >= 0 && col < 9;
      }

      function addSlidingMoves(row, col, isSente, directions, moves, boardState = initialBoard) {
        for (let d of directions) {
          let r = row + d.row;
          let c = col + d.col;
          while (isValidCoord(r, c)) {
            const target = boardState[r][c];
            if (target === '.') {
              moves.push({ row: r, col: c });
            } else {
              const targetIsSente = target === target.toUpperCase();
              if (isSente !== targetIsSente) {
                moves.push({ row: r, col: c });
              }
              break; 
            }
            r += d.row;
            c += d.col;
          }
        }
      }

      function getLegalMoves(row, col, piece, boardState = initialBoard) {
        const moves = [];
        const isSente = piece === piece.toUpperCase(); 
        const dir = isSente ? -1 : 1; 
        const isPromoted = piece.startsWith('+');
        const pType = piece.toLowerCase().replace('+', '');

        if (pType === 'g' || (isPromoted && ['p', 'l', 'n', 's'].includes(pType))) {
          const goldDirs = [
            {row: dir, col: 0}, {row: -dir, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}, {row: dir, col: -1}, {row: dir, col: 1}
          ];
          for (let d of goldDirs) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (!isPromoted && pType === 'p') {
          const nextRow = row + dir;
          if (isValidCoord(nextRow, col)) {
            const target = boardState[nextRow][col];
            if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
              moves.push({ row: nextRow, col: col });
            }
          }
        }
        else if (pType === 'k') {
          const directions = [
            {row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}, 
            {row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}
          ];
          for (let d of directions) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (pType === 's') {
          const silverDirs = [
            {row: dir, col: 0}, {row: dir, col: -1}, {row: dir, col: 1}, {row: -dir, col: -1}, {row: -dir, col: 1}
          ];
          for (let d of silverDirs) {
            const r = row + d.row;
            const c = col + d.col;
            if (isValidCoord(r, c)) {
              const target = boardState[r][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: r, col: c });
              }
            }
          }
        }
        else if (pType === 'n') {
          const knightRow = row + (dir * 2);
          const knightCols = [col - 1, col + 1];
          for (let c of knightCols) {
            if (isValidCoord(knightRow, c)) {
              const target = boardState[knightRow][c];
              if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                moves.push({ row: knightRow, col: c });
              }
            }
          }
        }
        else if (pType === 'l') {
          addSlidingMoves(row, col, isSente, [{row: dir, col: 0}], moves, boardState);
        }
        else if (pType === 'r') {
          addSlidingMoves(row, col, isSente, [
            {row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}
          ], moves, boardState);
          if (isPromoted) {
            const diagDirs = [{row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}];
            for (let d of diagDirs) {
              const r = row + d.row;
              const c = col + d.col;
              if (isValidCoord(r, c)) {
                const target = boardState[r][c];
                if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                  moves.push({ row: r, col: c });
                }
              }
            }
          }
        }
        else if (pType === 'b') {
          addSlidingMoves(row, col, isSente, [
            {row: -1, col: -1}, {row: -1, col: 1}, {row: 1, col: -1}, {row: 1, col: 1}
          ], moves, boardState);
          if (isPromoted) {
            const orthoDirs = [{row: -1, col: 0}, {row: 1, col: 0}, {row: 0, col: -1}, {row: 0, col: 1}];
            for (let d of orthoDirs) {
              const r = row + d.row;
              const c = col + d.col;
              if (isValidCoord(r, c)) {
                const target = boardState[r][c];
                if (target === '.' || (isSente ? target === target.toLowerCase() : target === target.toUpperCase())) {
                  moves.push({ row: r, col: c });
                }
              }
            }
          }
        }

        return moves;
      }

      function findKing(player, boardState = initialBoard) {
        const kingChar = player === 'sente' ? 'K' : 'k';
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (boardState[r][c] === kingChar) {
              return { row: r, col: c };
            }
          }
        }
        return null;
      }

      function isSquareUnderAttack(row, col, attackingPlayer, boardState = initialBoard) {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const piece = boardState[r][c];
            if (piece !== '.') {
              const isPieceSente = piece === piece.toUpperCase();
              const pieceOwner = isPieceSente ? 'sente' : 'gote';
              if (pieceOwner === attackingPlayer) {
                const moves = getLegalMoves(r, c, piece, boardState);
                if (moves.some(m => m.row === row && m.col === col)) {
                  return true;
                }
              }
            }
          }
        }
        return false;
      }

      function isInCheck(player, boardState = initialBoard) {
        const kingPos = findKing(player, boardState);
        if (!kingPos) return false;
        const opponent = player === 'sente' ? 'gote' : 'sente';
        return isSquareUnderAttack(kingPos.row, kingPos.col, opponent, boardState);
      }

      function hasAnyLegalMoves(player) {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const piece = initialBoard[r][c];
            if (piece !== '.' && ((player === 'sente' && piece === piece.toUpperCase()) || (player === 'gote' && piece === piece.toLowerCase()))) {
              const moves = getLegalMoves(r, c, piece);
              if (moves.length > 0) return true;
            }
          }
        }
        const hand = player === 'sente' ? senteHand : goteHand;
        if (hand.length > 0) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (initialBoard[r][c] === '.') return true;
            }
          }
        }
        return false;
      }

      function renderHands() {
        const senteUI = document.getElementById('senteHandUI');
        const goteUI = document.getElementById('goteHandUI');
        senteUI.innerHTML = '';
        goteUI.innerHTML = '';

        senteHand.forEach((p, index) => {
          const div = document.createElement('div');
          div.classList.add('hand-piece');
          if (!gameOver && currentTurn === 'sente' && selectedHandPiece === index) {
            div.classList.add('selected');
          }
          div.innerText = pieceKanji[p] || p;
          div.addEventListener('click', () => selectHandPiece('sente', index));
          senteUI.appendChild(div);
        });

        goteHand.forEach((p, index) => {
          const div = document.createElement('div');
          div.classList.add('hand-piece', 'gote');
          if (!gameOver && currentTurn === 'gote' && selectedHandPiece === index) {
            div.classList.add('selected');
          }
          div.innerText = pieceKanji[p] || p;
          div.addEventListener('click', () => selectHandPiece('gote', index));
          goteUI.appendChild(div);
        });
      }

      function selectHandPiece(player, index) {
        if (gameOver || currentTurn !== player) return;
        
        if (selectedHandPiece === index) {
          selectedHandPiece = null;
          validMoves = [];
        } else {
          selectedHandPiece = index;
          selectedTile = null;
          validMoves = [];
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (initialBoard[r][c] === '.') {
                validMoves.push({ row: r, col: c });
              }
            }
          }
        }
        renderBoard();
        renderHands();
      }

      function renderBoard() {
        const boardElement = document.getElementById('shogiBoard');
        boardElement.innerHTML = '';
        
        const activeOppName = opponents[currentOpponentIndex].name;
        const turnText = currentTurn === 'sente' ? 'Sente (Player)' : `Gote (${gameMode === 'pvc' ? activeOppName : 'Opponent'})`;
        document.getElementById('turnIndicator').innerText = `Current Turn: ${turnText}`;

        const statusBanner = document.getElementById('statusBanner');
        if (gameOver) {
          statusBanner.innerText = `GAME OVER! ${currentTurn === 'sente' ? (gameMode === 'pvc' ? activeOppName : 'Gote') : 'Sente'} wins!`;
        } else if (warningMessage) {
          statusBanner.innerText = warningMessage;
        } else if (isInCheck(currentTurn)) {
          statusBanner.innerText = `⚠️ CHECK! Your King is under attack!`;
        } else {
          statusBanner.innerText = '';
        }

        const checkedKingPos = isInCheck(currentTurn) ? findKing(currentTurn) : null;

        for (let row = 0; row < 9; row++) {
          for (let col = 0; col < 9; col++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.dataset.row = row;
            tile.dataset.col = col;

            if (validMoves.some(m => m.row === row && m.col === col)) {
              tile.classList.add('highlight');
            }

            if (checkedKingPos && checkedKingPos.row === row && checkedKingPos.col === col) {
              tile.classList.add('check-glow');
            }

            const piece = initialBoard[row][col];
            if (piece !== '.') {
              const span = document.createElement('span');
              span.innerText = pieceKanji[piece] || piece;
              if (piece === piece.toLowerCase()) {
                span.classList.add('gote');
              } else {
                span.classList.add('sente');
              }
              tile.appendChild(span);
            }

            tile.addEventListener('click', () => handleTileClick(row, col));
            boardElement.appendChild(tile);
          }
        }
        renderHands();
      }

      function handleTileClick(row, col) {
        if (gameOver) return;
        const clickedPiece = initialBoard[row][col];
        warningMessage = '';
        
        if (selectedHandPiece !== null) {
          const isValidDrop = validMoves.some(m => m.row === row && m.col === col);
          if (isValidDrop && clickedPiece === '.') {
            const hand = currentTurn === 'sente' ? senteHand : goteHand;
            const droppedPiece = hand.splice(selectedHandPiece, 1)[0];
            
            initialBoard[row][col] = droppedPiece;

            const movingPlayer = currentTurn;
            if (isInCheck(movingPlayer)) {
              warningMessage = `⚠️ Warning: You dropped a piece and left your King in check!`;
            }

            currentTurn = currentTurn === 'sente' ? 'gote' : 'sente';
            selectedHandPiece = null;
            validMoves = [];

            if (!hasAnyLegalMoves(currentTurn)) {
              gameOver = true;
            }

            renderBoard();
          }
          return;
        }

        if (selectedTile === null) {
          const isCurrentSentePiece = clickedPiece !== '.' && clickedPiece === clickedPiece.toUpperCase();
          const isCurrentGotePiece = clickedPiece !== '.' && clickedPiece === clickedPiece.toLowerCase();

          if ((currentTurn === 'sente' && isCurrentSentePiece) || (currentTurn === 'gote' && isCurrentGotePiece)) {
            selectedTile = { row, col };
            validMoves = getLegalMoves(row, col, clickedPiece);
            renderBoard();
            
            const idx = row * 9 + col;
            document.getElementById('shogiBoard').children[idx].classList.add('selected');
          }
        } else {
          const isValidMove = validMoves.some(m => m.row === row && m.col === col);
          
          if (isValidMove) {
            const movingPiece = initialBoard[selectedTile.row][selectedTile.col];
            const targetBackup = initialBoard[row][col];

            initialBoard[row][col] = movingPiece;
            initialBoard[selectedTile.row][selectedTile.col] = '.';

            const movingPlayer = currentTurn;
            if (isInCheck(movingPlayer)) {
              warningMessage = `⚠️ Warning: You moved your King/piece into check! Brave, but risky.`;
            }

            if (targetBackup !== '.') {
              const capturedBase = targetBackup.toLowerCase().replace('+', '');
              if (currentTurn === 'sente') {
                senteHand.push(capturedBase.toUpperCase());
              } else {
                goteHand.push(capturedBase.toLowerCase());
              }
            }

            let finalPiece = initialBoard[row][col];
            let isPromoted = finalPiece.startsWith('+');
            const baseType = finalPiece.toLowerCase().replace('+', '');
            const inPromotionZone = (currentTurn === 'sente' && (row <= 2 || selectedTile.row <= 2)) ||
                                    (currentTurn === 'gote' && (row >= 6 || selectedTile.row >= 6));

            if (!isPromoted && inPromotionZone && baseType !== 'g' && baseType !== 'k') {
              if (confirm(`Do you want to promote this ${pieceKanji[finalPiece] || finalPiece}?`)) {
                finalPiece = currentTurn === 'sente' ? promotedPieces[finalPiece].toUpperCase() : promotedPieces[finalPiece].toLowerCase();
                initialBoard[row][col] = finalPiece;
              }
            }

            currentTurn = currentTurn === 'sente' ? 'gote' : 'sente';

            if (!hasAnyLegalMoves(currentTurn)) {
              gameOver = true;
            }
          }
          
          selectedTile = false;
          selectedTile = null;
          validMoves = [];
          renderBoard();
        }
      }
    </script>
  </body>
</html>
